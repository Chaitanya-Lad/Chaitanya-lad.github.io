      <stop offset="1" stop-color="#54a9e8"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#54cbb1" stop-opacity=".24"/>
      <stop offset="1" stop-color="#54cbb1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="805" cy="450" r="510" fill="url(#ambient)"/>
  <circle cx="1260" cy="190" r="190" fill="#6480df" opacity=".06"/>
