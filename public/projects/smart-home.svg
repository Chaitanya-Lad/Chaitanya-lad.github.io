<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">IoT-based smart home automation</title>
  <desc id="description">A connected home controlled with Arduino, Raspberry Pi, Blynk, and Google Assistant.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
